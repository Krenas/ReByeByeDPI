name: Android verification build

on:
  push:
    branches:
      - maintenance/service-readiness
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test Android app
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source and native submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install project SDK components
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Verify native submodules
        run: git submodule status --recursive

      - name: Run unit tests and build debug APK
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest :app:assembleDebug

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: rebyebyedpi-debug-apk
          path: app/build/outputs/apk/debug/**/*.apk
          if-no-files-found: error
          retention-days: 14
